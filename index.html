<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101020">
  <meta name="description" content="FotoAkademia – interaktywna nauka fotografii">

  <script>
    const teacherView = new URLSearchParams(location.search).get('panel') === 'local';
    const manifestLink = document.createElement('link');
    manifestLink.rel = 'manifest';
    manifestLink.href = teacherView ? 'nauczyciel.webmanifest' : 'manifest.webmanifest';
    document.head.append(manifestLink);
  </script>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">

  <title>FotoAkademia 2.0</title>
</head>

<body>
  <button id="app-update" class="btn alt" type="button" hidden>Odśwież do nowej wersji</button>
  <div id="app"></div>

  <script src="supabase-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
